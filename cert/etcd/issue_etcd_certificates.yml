---
- name: Install etcd certificates and enable TLS
  hosts: etcd
  become: true
  gather_facts: false
  vars:
    cert_output_dir: "{{ playbook_dir }}/generated"
    etcd_tls_dir: /etc/etcd/pki
    etcdctl_binary: /usr/local/bin/etcdctl
    etcd_initial_cluster: >-
      {{ groups['etcd']
      | map('extract', hostvars)
      | map(attribute='etcd_name')
      | zip(groups['etcd'] | map('extract', hostvars) | map(attribute='ansible_host'))
      | map('join', '=')
      | map('regex_replace', '=', '=https://', 1)
      | map('regex_replace', '$', ':' ~ etcd_peer_port)
      | join(',') }}

  pre_tasks:
    - name: Validate the existing local certificate bundle
      ansible.builtin.stat:
        path: "{{ cert_output_dir }}/{{ item }}"
      delegate_to: localhost
      become: false
      register: certificate_bundle
      loop:
        - ca.pem
        - "{{ etcd_name }}.pem"
        - "{{ etcd_name }}-key.pem"

    - name: Stop when an existing etcd certificate is missing
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Required generated certificate is missing: {{ item.item }}"
      loop: "{{ certificate_bundle.results }}"

    - name: Verify the existing certificate matches this etcd host IP
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ cert_output_dir }}/{{ etcd_name }}.pem"
          - -checkip
          - "{{ ansible_host }}"
          - -noout
      delegate_to: localhost
      become: false
      changed_when: false

  tasks:
    - name: Ensure the etcd group exists
      ansible.builtin.group:
        name: etcd
        state: present

    - name: Ensure the etcd user exists
      ansible.builtin.user:
        name: etcd
        group: etcd
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/etcd
        create_home: false

    - name: Create the etcd TLS directory
      ansible.builtin.file:
        path: "{{ etcd_tls_dir }}"
        state: directory
        owner: etcd
        group: etcd
        mode: "0750"

    - name: Install the etcd CA certificate
      ansible.builtin.copy:
        src: "{{ cert_output_dir }}/ca.pem"
        dest: "{{ etcd_tls_dir }}/ca.pem"
        owner: root
        group: etcd
        mode: "0640"
      notify: Restart etcd

    - name: Install the node certificate
      ansible.builtin.copy:
        src: "{{ cert_output_dir }}/{{ etcd_name }}.pem"
        dest: "{{ etcd_tls_dir }}/server.pem"
        owner: etcd
        group: etcd
        mode: "0640"
      notify: Restart etcd

    - name: Install the node private key
      ansible.builtin.copy:
        src: "{{ cert_output_dir }}/{{ etcd_name }}-key.pem"
        dest: "{{ etcd_tls_dir }}/server-key.pem"
        owner: etcd
        group: etcd
        mode: "0600"
      notify: Restart etcd

    - name: Install the TLS-enabled etcd systemd unit
      ansible.builtin.template:
        src: etcd-tls.service.j2
        dest: /etc/systemd/system/etcd.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart etcd

    - name: Enable and start etcd with TLS
      ansible.builtin.systemd:
        name: etcd
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart etcd
      ansible.builtin.systemd:
        name: etcd
        state: restarted
