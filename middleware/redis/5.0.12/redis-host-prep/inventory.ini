
[redis_nodes]
#Connect to redis cluster nodes using ansible_host IP, but configure redis cluster using net_ip IP
# redis-01: redis cluster node 1, ansible connects to this IP for management
# redis-01 ansible_host=10.168.2.67 net_ip=10.168.2.48/24 net_gw=10.168.2.1 iface=eth0
# # redis-02: redis cluster node 2, ansible connects to this IP for management
# redis-02 ansible_host=10.168.2.68 net_ip=10.168.2.49/24 net_gw=10.168.2.1 iface=eth0
# # redis-03: redis cluster node 3, ansible connects to this IP for management
# redis-03 ansible_host=10.168.2.69 net_ip=10.168.2.50/24 net_gw=10.168.2.1 iface=eth0
# # redis-04: redis cluster node 4, ansible connects to this IP for management
# redis-04 ansible_host=10.168.2.54 net_ip=10.168.2.54/24 net_gw=10.168.2.1 iface=eth0
# # redis-05: redis cluster node 5, ansible connects to this IP for management
# redis-05 ansible_host=10.168.2.55 net_ip=10.168.2.55/24 net_gw=10.168.2.1 iface=eth0
# # redis-06: redis cluster node 6, ansible connects to this IP for management
# redis-06 ansible_host=10.168.2.56 net_ip=10.168.2.56/24 net_gw=10.168.2.1 iface=eth0

#connect to host ips
10.168.2.54
10.168.2.55
10.168.2.56
# Variable explanation reference (can place at top of inventory)
# ansible_host: IP address Ansible uses to establish SSH connection
# net_ip: main IP address with CIDR for network configuration
# net_gw: default gateway of the host
# iface: target network interface name


[redis_nodes:vars]
ansible_python_interpreter=/usr/bin/python3
