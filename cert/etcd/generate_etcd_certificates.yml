---
- name: Generate etcd mutual TLS certificates with CFSSL
  hosts: "{{ groups['etcd'][0] }}"
  connection: local
  gather_facts: false
  vars:
    cert_output_dir: "{{ playbook_dir }}/generated"
    ca_config_file: "{{ playbook_dir }}/ca-config.json"
    ca_csr_file: "{{ playbook_dir }}/ca-csr.json"
  tasks:
    - name: Check for cfssl
      ansible.builtin.shell: command -v cfssl
      register: cfssl_binary
      changed_when: false
      failed_when: cfssl_binary.rc != 0

    - name: Check for cfssljson
      ansible.builtin.shell: command -v cfssljson
      register: cfssljson_binary
      changed_when: false
      failed_when: cfssljson_binary.rc != 0

    - name: Create the local certificate output directory
      ansible.builtin.file:
        path: "{{ cert_output_dir }}"
        state: directory
        mode: "0700"

    - name: Copy the CFSSL configuration
      ansible.builtin.copy:
        src: "{{ ca_config_file }}"
        dest: "{{ cert_output_dir }}/ca-config.json"
        mode: "0600"

    - name: Copy the CA CSR definition
      ansible.builtin.copy:
        src: "{{ ca_csr_file }}"
        dest: "{{ cert_output_dir }}/ca-csr.json"
        mode: "0600"

    - name: Generate the etcd certificate authority
      ansible.builtin.shell: cfssl gencert -initca ca-csr.json | cfssljson -bare ca
      args:
        chdir: "{{ cert_output_dir }}"
        creates: "{{ cert_output_dir }}/ca.pem"
      no_log: true

    - name: Create an etcd certificate request for each node
      ansible.builtin.copy:
        dest: "{{ cert_output_dir }}/{{ hostvars[item].etcd_name }}-csr.json"
        mode: "0600"
        content: >-
          {{ {'CN': hostvars[item].etcd_name, 'hosts': [hostvars[item].etcd_name,
          'localhost', hostvars[item].ansible_host], 'key':
          {'algo': 'rsa', 'size': 2048}, 'names': [{'C': 'CN', 'ST': 'Sichuan',
          'L': 'Chengdu', 'O': 'etcd', 'OU': 'Cluster'}]} | to_nice_json }}
      loop: "{{ groups['etcd'] }}"

    - name: Generate the etcd node certificates
      ansible.builtin.shell: >-
        cfssl gencert -ca=ca.pem -ca-key=ca-key.pem
        -config=ca-config.json -profile=etcd
        {{ hostvars[item].etcd_name }}-csr.json |
        cfssljson -bare {{ hostvars[item].etcd_name }}
      args:
        chdir: "{{ cert_output_dir }}"
        creates: "{{ cert_output_dir }}/{{ hostvars[item].etcd_name }}.pem"
      loop: "{{ groups['etcd'] }}"
      no_log: true

    - name: Set generated certificate permissions
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0600"
      loop: "{{ query('ansible.builtin.fileglob', cert_output_dir + '/*') }}"