---
- name: Generate Kubernetes 1.25 control-plane certificates with CFSSL
  hosts: "{{ groups['kube_control_plane'][0] }}"
  connection: local
  gather_facts: false
  vars:
    cert_output_dir: "{{ playbook_dir }}/generated"
    ca_config_file: "{{ playbook_dir }}/ca-config.json"
    ca_csr_file: "{{ playbook_dir }}/ca-csr.json"
    front_proxy_ca_csr_file: "{{ playbook_dir }}/front-proxy-ca-csr.json"

    kubernetes_api_server_sans: >-
      {{ [
        kubernetes_api_server_address,
        kubernetes_api_server_dns,
        'kubernetes.default',
        'kubernetes.default.svc',
        'kubernetes.default.svc.' ~ kubernetes_cluster_domain,
        kubernetes_cluster_dns
      ]
      + (kubernetes_api_server_extra_sans | default([]))
      + (kubernetes_api_server_extra_dns_names | default([]))
      | unique }}

    certificate_requests:
      - name: apiserver
        cn: kube-apiserver
        profile: kubernetes
        hosts: "{{ kubernetes_api_server_sans }}"
      - name: apiserver-kubelet-client
        cn: kube-apiserver-kubelet-client
        profile: kubernetes
        hosts: []
      - name: admin
        cn: admin
        organization: system:masters
        profile: kubernetes
        hosts: []
      - name: controller-manager
        cn: system:kube-controller-manager
        profile: kubernetes
        hosts: []
      - name: scheduler
        cn: system:kube-scheduler
        profile: kubernetes
        hosts: []
      - name: front-proxy-client
        cn: front-proxy-client
        profile: front-proxy-client
        ca_prefix: front-proxy-ca
        hosts: []

  tasks:
    - name: Check for cfssl
      ansible.builtin.shell: command -v cfssl
      register: cfssl_binary
      changed_when: false
      failed_when: cfssl_binary.rc != 0

    - name: Check for cfssljson
      ansible.builtin.shell: command -v cfssljson
      register: cfssljson_binary
      changed_when: false
      failed_when: cfssljson_binary.rc != 0

    - name: Create the local certificate output directory
      ansible.builtin.file:
        path: "{{ cert_output_dir }}"
        state: directory
        mode: "0700"

    - name: Copy the Kubernetes CFSSL configuration
      ansible.builtin.copy:
        src: "{{ ca_config_file }}"
        dest: "{{ cert_output_dir }}/ca-config.json"
        mode: "0600"

    - name: Copy the Kubernetes CA CSR definition
      ansible.builtin.copy:
        src: "{{ ca_csr_file }}"
        dest: "{{ cert_output_dir }}/ca-csr.json"
        mode: "0600"

    - name: Copy the front-proxy CA CSR definition
      ansible.builtin.copy:
        src: "{{ front_proxy_ca_csr_file }}"
        dest: "{{ cert_output_dir }}/front-proxy-ca-csr.json"
        mode: "0600"

    - name: Generate the Kubernetes certificate authority
      ansible.builtin.shell: |
        cfssl gencert -initca ca-csr.json | cfssljson -bare ca
      args:
        chdir: "{{ cert_output_dir }}"
        creates: "{{ cert_output_dir }}/ca.pem"
      no_log: true

    - name: Generate the front-proxy certificate authority
      ansible.builtin.shell: |
        cfssl gencert -initca front-proxy-ca-csr.json | cfssljson -bare front-proxy-ca
      args:
        chdir: "{{ cert_output_dir }}"
        creates: "{{ cert_output_dir }}/front-proxy-ca.pem"
      no_log: true

    - name: Create a CSR for each control-plane certificate
      ansible.builtin.copy:
        dest: "{{ cert_output_dir }}/{{ item.name }}-csr.json"
        mode: "0600"
        content: "{{ {'CN': item.cn, 'hosts': item.hosts, 'key': {'algo': 'rsa', 'size': 2048}, 'names': [{'C': 'CN', 'ST': 'Sichuan', 'L': 'Chengdu', 'O': item.organization | default('Kubernetes'), 'OU': 'Control Plane'}]} | to_nice_json }}\n"
      loop: "{{ certificate_requests }}"

    - name: Generate control-plane certificates with the configured CA
      ansible.builtin.shell: |
        cfssl gencert \
          -ca={{ item.ca_prefix | default('ca') }}.pem \
          -ca-key={{ item.ca_prefix | default('ca') }}-key.pem \
          -config=ca-config.json \
          -profile={{ item.profile }} \
          {{ item.name }}-csr.json | \
          cfssljson -bare {{ item.name }}
      args:
        chdir: "{{ cert_output_dir }}"
        creates: "{{ cert_output_dir }}/{{ item.name }}.pem"
      loop: "{{ certificate_requests }}"
      no_log: true

    - name: Generate the service-account signing keypair
      ansible.builtin.shell: |
        openssl genrsa -out sa.key 2048
        openssl rsa -in sa.key -pubout -out sa.pub
      args:
        chdir: "{{ cert_output_dir }}"
        creates: "{{ cert_output_dir }}/sa.key"

    - name: Set generated certificate permissions
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0600"
      loop: "{{ query('ansible.builtin.fileglob', cert_output_dir + '/*') }}"
