---
- name: Install or uninstall Kubernetes node components
  hosts: kubernetes_node
  become: true
  gather_facts: true

  vars:
    kubelet_url: "{{ kubernetes_download_mirror }}/dl.k8s.io/release/v{{ kubelet_version }}/bin/linux/{{ kubernetes_arch }}/kubelet"
    kube_proxy_url: "{{ kubernetes_download_mirror }}/dl.k8s.io/release/v{{ kube_proxy_version }}/bin/linux/{{ kubernetes_arch }}/kube-proxy"
    node_certificate_source: "{{ kubernetes_node_cert_source_base }}/{{ inventory_hostname }}"

  pre_tasks:
    - name: Validate node action
      ansible.builtin.assert:
        that: node_install_uninstall_action | lower in ['install', 'uninstall']
        fail_msg: "node_install_uninstall_action must be install or uninstall."

    - name: Verify supported node platform
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
          - ansible_facts.architecture == 'x86_64'
        fail_msg: "This playbook supports Debian-family amd64 hosts only."

    - name: Verify node certificate files on the control machine
      ansible.builtin.stat:
        path: "{{ item }}"
      delegate_to: localhost
      become: false
      register: node_certificate_files
      loop:
        - "{{ kubernetes_ca_source }}/ca.pem"
        - "{{ node_certificate_source }}/kubelet.pem"
        - "{{ node_certificate_source }}/kubelet-key.pem"
        - "{{ node_certificate_source }}/kube-proxy.pem"
        - "{{ node_certificate_source }}/kube-proxy-key.pem"
      when: node_install_uninstall_action | lower == 'install'

    - name: Stop when a node certificate file is missing
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Missing certificate file on the control machine: {{ item.item }}"
      loop: "{{ node_certificate_files.results | default([]) }}"
      when: node_install_uninstall_action | lower == 'install'

  tasks:
    - name: Install Kubernetes node components
      block:
        - name: Install node dependencies
          ansible.builtin.apt:
            name:
              - ca-certificates
              - conntrack
              - ebtables
              - ethtool
              - ipset
              - iptables
              - socat
              - tar
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Create node directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: '0755'
          loop:
            - "{{ kubernetes_binary_dir }}"
            - "{{ kubernetes_config_dir }}"
            - "{{ cni_binary_dir }}"
            - "{{ cni_config_dir }}"
            - "{{ kubernetes_node_data_dir }}"

        - name: Download kubelet
          ansible.builtin.get_url:
            url: "{{ kubelet_url }}"
            dest: "{{ kubernetes_binary_dir }}/kubelet"
            mode: '0755'

        - name: Download kube-proxy
          ansible.builtin.get_url:
            url: "{{ kube_proxy_url }}"
            dest: "{{ kubernetes_binary_dir }}/kube-proxy"
            mode: '0755'

        - name: Create node PKI directory
          ansible.builtin.file:
            path: "{{ kubernetes_node_cert_dir }}"
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: Copy cluster CA certificate
          ansible.builtin.copy:
            src: "{{ kubernetes_ca_source }}/ca.pem"
            dest: "{{ kubernetes_node_ca_path }}"
            owner: root
            group: root
            mode: '0644'

        - name: Copy node-specific certificates
          ansible.builtin.copy:
            src: "{{ item.source }}"
            dest: "{{ item.dest }}"
            owner: root
            group: root
            mode: '0600'
          loop:
            - source: "{{ node_certificate_source }}/kubelet.pem"
              dest: "{{ kubernetes_node_kubelet_cert_path }}"
            - source: "{{ node_certificate_source }}/kubelet-key.pem"
              dest: "{{ kubernetes_node_kubelet_key_path }}"
            - source: "{{ node_certificate_source }}/kube-proxy.pem"
              dest: "{{ kubernetes_node_kube_proxy_cert_path }}"
            - source: "{{ node_certificate_source }}/kube-proxy-key.pem"
              dest: "{{ kubernetes_node_kube_proxy_key_path }}"

        - name: Generate node-specific kube-proxy kubeconfig
          ansible.builtin.template:
            src: kube-proxy.conf.j2
            dest: "{{ kube_proxy_kubeconfig }}"
            owner: root
            group: root
            mode: '0600'

        - name: Generate node-specific kubelet kubeconfig
          ansible.builtin.template:
            src: kubelet.conf.j2
            dest: "{{ kubelet_kubeconfig }}"
            owner: root
            group: root
            mode: '0600'

        - name: Install kubelet systemd unit
          ansible.builtin.template:
            src: kubelet.service.j2
            dest: /etc/systemd/system/kubelet.service
            owner: root
            group: root
            mode: '0644'
          notify: Reload systemd

        - name: Install kube-proxy systemd unit
          ansible.builtin.template:
            src: kube-proxy.service.j2
            dest: /etc/systemd/system/kube-proxy.service
            owner: root
            group: root
            mode: '0644'
          notify: Reload systemd

        - name: Write kube-proxy configuration
          ansible.builtin.template:
            src: kube-proxy-config.yaml.j2
            dest: "{{ kubernetes_config_dir }}/kube-proxy.yaml"
            owner: root
            group: root
            mode: '0644'

        - name: Enable and start kubelet
          ansible.builtin.systemd:
            name: kubelet
            enabled: true
            state: started
            daemon_reload: true

        - name: Enable and start kube-proxy
          ansible.builtin.systemd:
            name: kube-proxy
            enabled: true
            state: started
            daemon_reload: true
      when: node_install_uninstall_action | lower == 'install'

    - name: Uninstall Kubernetes node components
      block:
        - name: Stop and disable node services
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
            enabled: false
          loop:
            - kubelet
            - kube-proxy
          failed_when: false

        - name: Remove node service units
          ansible.builtin.file:
            path: "/etc/systemd/system/{{ item }}.service"
            state: absent
          loop:
            - kubelet
            - kube-proxy
          notify: Reload systemd

        - name: Remove node binaries and configuration
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ kubernetes_binary_dir }}/kubelet"
            - "{{ kubernetes_binary_dir }}/kube-proxy"
            - "{{ kube_proxy_kubeconfig }}"
            - "{{ kubelet_kubeconfig }}"
            - "{{ kubernetes_config_dir }}/kube-proxy.yaml"
            - /var/lib/kubelet/config.yaml
            - "{{ cni_config_dir }}"
            - "{{ kubernetes_node_cert_dir }}"

        - name: Remove node data when requested
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ kubernetes_node_data_dir }}"
            - /var/lib/cni
          when: node_install_uninstall_remove_data | bool
      when: node_install_uninstall_action | lower == 'uninstall'

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
