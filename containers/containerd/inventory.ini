[containerd]
# Replace this example with your target host address.
k8s-master-01 ansible_host=10.168.2.100
k8s-master-02 ansible_host=10.168.2.101
k8s-master-03 ansible_host=10.168.2.102
k8s-node-01 ansible_host=10.168.2.103
k8s-node-02 ansible_host=10.168.2.104
k8s-node-03 ansible_host=10.168.2.105
k8s-node-04 ansible_host=10.168.2.106
k8s-node-05 ansible_host=10.168.2.107
etcd01 ansible_host=10.168.2.108
etcd02 ansible_host=10.168.2.109
etcd03 ansible_host=10.168.2.110


[containerd:vars]
ansible_user=root
ansible_become=true

# Set the operation to install or uninstall.
containerd_action=install

# Pinned component versions.
containerd_version=1.6.24
runc_version=1.1.10
crictl_version=1.25.0

# Download mirror and installation paths.
download_mirror=https://files.m.daocloud.io
containerd_install_prefix=/usr/local
containerd_binary_dir=/usr/local/bin
containerd_runc_path=/usr/local/sbin/runc
containerd_config_path=/etc/containerd/config.toml
containerd_service_path=/etc/systemd/system/containerd.service
containerd_data_dir=/var/lib/containerd

# Runtime configuration.
containerd_configure_systemd_cgroup=true
# CRI sandbox image for pause pods. Override here when using a private mirror or a different tag.
containerd_sandbox_image=registry.aliyuncs.com/google_containers/pause:3.6

# Keep container data during uninstall unless explicitly set to true.
containerd_remove_data=false
