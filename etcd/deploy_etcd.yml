---
- name: Deploy etcd 3.5 cluster
  hosts: etcd
  become: true
  gather_facts: true

  vars:
    etcd_download_url: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
    etcd_install_dir: "/opt/etcd-{{ etcd_version }}"
    etcd_binary_dir: "/usr/local/bin"

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - tar
        state: present
        update_cache: true
        cache_valid_time: 3600
      when:
        - etcd_task_install_required_packages_enabled | default(true) | bool
        - ansible_facts.os_family == "Debian"

    - name: Create etcd group
      ansible.builtin.group:
        name: etcd
        state: present
      when: etcd_task_create_etcd_group_enabled | default(true) | bool

    - name: Create etcd user
      ansible.builtin.user:
        name: etcd
        group: etcd
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/etcd
        create_home: false
      when: etcd_task_create_etcd_user_enabled | default(true) | bool

    - name: Create etcd directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: etcd
        group: etcd
        mode: "0755"
      loop:
        - "{{ etcd_install_dir }}"
        - "{{ etcd_data_dir }}"
      when: etcd_task_create_etcd_directories_enabled | default(true) | bool

    - name: Download etcd archive
      ansible.builtin.get_url:
        url: "{{ etcd_download_url }}"
        dest: "/tmp/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
        mode: "0644"
        checksum: "{{ ('sha256:' + etcd_sha256) if etcd_sha256 is defined else omit }}"
      when: etcd_task_download_etcd_archive_enabled | default(false) | bool

    - name: Extract etcd archive
      ansible.builtin.unarchive:
        src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
        dest: "/opt"
        remote_src: true
        creates: "/opt/etcd-v{{ etcd_version }}-linux-amd64/etcd"
      when: etcd_task_extract_etcd_archive_enabled | default(true) | bool

    - name: Install etcd binaries
      ansible.builtin.copy:
        src: "/opt/etcd-v{{ etcd_version }}-linux-amd64/{{ item }}"
        dest: "{{ etcd_binary_dir }}/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      loop:
        - etcd
        - etcdctl
        - etcdutl
      when: etcd_task_install_etcd_binaries_enabled | default(true) | bool
      notify: Restart etcd

    - name: Deploy etcd systemd unit
      ansible.builtin.template:
        src: etcd.service.j2
        dest: /etc/systemd/system/etcd.service
        owner: root
        group: root
        mode: "0644"
      when: etcd_task_deploy_etcd_systemd_unit_enabled | default(true) | bool
      notify:
        - Reload systemd
        - Restart etcd

    - name: Enable and start etcd
      ansible.builtin.systemd:
        name: etcd
        enabled: true
        state: started
        daemon_reload: true
      when: etcd_task_enable_and_start_etcd_enabled | default(true) | bool

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: etcd_handler_reload_systemd_enabled | default(true) | bool

    - name: Restart etcd
      ansible.builtin.systemd:
        name: etcd
        state: restarted
      when: etcd_handler_restart_etcd_enabled | default(true) | bool
