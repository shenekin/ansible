[kube_control_plane]
k8s-master-01 ansible_host=10.168.2.100 etcd_certificate_name=etcd01
k8s-master-02 ansible_host=10.168.2.101 etcd_certificate_name=etcd02
k8s-master-03 ansible_host=10.168.2.102 etcd_certificate_name=etcd03

[kube_control_plane:vars]
ansible_user=root
ansible_become=true

# Kubernetes release and local certificate bundle.
kubernetes_version=1.25.0
kubernetes_arch=amd64
kubernetes_cert_source=/root/ansible-playbook/cert/k8s/master/generated
etcd_cert_source=/root/ansible-playbook/cert/etcd/generated

# The address used by clients and by component kubeconfigs.
kubernetes_api_server_address=10.168.2.188
kubernetes_api_server_port=6443
kubernetes_cluster_name=kubernetes
kubernetes_cluster_domain=cluster.local
kubernetes_service_cidr=10.96.0.0/12
kubernetes_service_cluster_ip=10.96.0.1
kubernetes_cluster_dns=10.96.0.10

# The etcd TLS playbook installs these files on every etcd/control-plane host.
kubernetes_etcd_endpoints=https://10.168.2.108:2379,https://10.168.2.109:2379,https://10.168.2.110:2379
kubernetes_etcd_ca_file=/etc/etcd/pki/ca.pem
kubernetes_etcd_cert_file=/etc/etcd/pki/server.pem
kubernetes_etcd_key_file=/etc/etcd/pki/server-key.pem
kubernetes_etcd_healthcheck_timeout=10s
kubernetes_etcd_readycheck_timeout=10s

# Optional extra API server SANs. The host addresses are added automatically.
kubernetes_api_server_extra_sans=[]
kubernetes_api_server_extra_dns_names=[]
