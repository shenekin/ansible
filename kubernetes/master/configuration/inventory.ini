[kube_control_plane]
k8s-master-01 ansible_host=10.168.2.100
k8s-master-02 ansible_host=10.168.2.101
k8s-master-03 ansible_host=10.168.2.102

[kube_node]
# Add worker hosts before running the playbook, for example:
# k8s-node-01 ansible_host=10.168.2.110
k8s-node-01 ansible_host=10.168.2.103
k8s-node-02 ansible_host=10.168.2.104
k8s-node-03 ansible_host=10.168.2.105
k8s-node-04 ansible_host=10.168.2.106
k8s-node-05 ansible_host=10.168.2.107
[kubernetes:children]
kube_control_plane
kube_node

[kubernetes:vars]
ansible_user=root
ansible_become=true
kubernetes_version=1.25.0
kubernetes_arch=amd64
kubernetes_api_server_address=10.168.2.188
kubernetes_api_server_port=6443
kubernetes_cluster_name=kubernetes
kubernetes_cluster_domain=cluster.local
kubernetes_cert_source=/root/ansible-playbook/cert/k8s/master/generated
kubernetes_configuration_output=/root/ansible-playbook/kubernetes/master/configuration/generated
kubernetes_token_id=kubele
kubernetes_token_secret=changethissecret
kubernetes_bootstrap_token_ttl=24h
kubernetes_kubelet_bootstrap_username=system:bootstrap:kubelet
kubernetes_kubelet_bootstrap_group=system:bootstrappers:kubelet