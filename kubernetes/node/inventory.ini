[kubernetes_node]
; k8s-master-01 ansible_host=10.168.2.100
; k8s-master-02 ansible_host=10.168.2.101
; k8s-master-03 ansible_host=10.168.2.102
k8s-node-01 ansible_host=10.168.2.103
k8s-node-02 ansible_host=10.168.2.104
k8s-node-03 ansible_host=10.168.2.105
k8s-node-04 ansible_host=10.168.2.106
k8s-node-05 ansible_host=10.168.2.107
; etcd01 ansible_host=10.168.2.108
; etcd02 ansible_host=10.168.2.109
; etcd03 ansible_host=10.168.2.1110


[kubernetes_node:vars]
ansible_user=root
ansible_become=true

# Operation: install or uninstall.
node_install_uninstall_action=install

# Kubernetes component versions.
kubelet_version=1.25.16
kube_proxy_version=1.25.16
kubernetes_arch=amd64

# Calico release, manifest, and image registry.
calico_version=3.26.5
calico_manifest_url=https://gh-proxy.com/https://raw.githubusercontent.com/projectcalico/calico/v3.26.5/manifests/calico.yaml
calico_manifest_path=/root/ansible-playbook/kubernetes/node/calico.yaml
calico_manifest_node_path=/root/calico.yaml
calico_archive_control_path=/root/ansible-playbook/kubernetes/node/calico-v3.26.5.tgz
calico_archive_node_path=/tmp/calico-v3.26.5.tgz
calico_image_registry=docker.m.daocloud.io
calico_image_namespace=calico
calico_release_mirror=https://files.m.daocloud.io

# Kubernetes binary mirror.
kubernetes_download_mirror=https://files.m.daocloud.io

# Cluster and runtime configuration.
kubernetes_api_server_address=10.168.2.188
kubernetes_api_server_port=6443
kubernetes_cluster_name=kubernetes
kubernetes_cluster_cidr=10.244.0.0/16
containerd_socket=unix:///run/containerd/containerd.sock
kube_proxy_kubeconfig_source=/root/ansible-playbook/kubernetes/master/configuration/generated/kube-proxy.conf
kube_proxy_kubeconfig=/etc/kubernetes/kube-proxy.conf
kubelet_bootstrap_kubeconfig_source=/root/ansible-playbook/kubernetes/master/configuration/generated/kubelet-bootstrap.conf
kubelet_bootstrap_kubeconfig=/etc/kubernetes/bootstrap-kubelet.conf
kubelet_config_path=/var/lib/kubelet/config.yaml
kubelet_kubeconfig=/etc/kubernetes/kubelet.conf
kubernetes_binary_dir=/usr/local/bin
cni_binary_dir=/opt/cni/bin
cni_config_dir=/etc/cni/net.d
kubernetes_config_dir=/etc/kubernetes
kubernetes_node_data_dir=/var/lib/kubelet

# Write systemd cgroup configuration for kubelet/containerd integration.
node_configure_systemd_cgroup=true

# Preserve node/container data during uninstall by default.
node_install_uninstall_remove_data=false
